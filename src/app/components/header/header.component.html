<ng-container *ngIf="personalData as data">
<ion-header [translucent]="true">
  <ion-toolbar>
    <a class="brand-lockup" href="#main-content" aria-label="Go to portfolio content">
      <span class="brand-mark" aria-hidden="true">
        <img [src]="avatarPath" alt="">
      </span>
      <span class="brand-copy">
        <strong>{{ data.name }}</strong>
        <small>{{ professionalTitle }}</small>
      </span>
    </a>

    <ion-buttons slot="end" class="universe-actions">
      <ion-button class="universe-launch" (click)="openUniverse.emit()" [attr.aria-label]="'header.openUniverse' | translate">
        <span class="network-world" aria-hidden="true">
          <span class="network-world__latitude network-world__latitude--north"></span>
          <span class="network-world__latitude network-world__latitude--south"></span>
          <span class="network-world__orbit network-world__orbit--one"></span>
          <span class="network-world__orbit network-world__orbit--two"></span>
          <span class="network-world__node network-world__node--one"></span>
          <span class="network-world__node network-world__node--two"></span>
          <span class="network-world__node network-world__node--three"></span>
        </span>
        <span class="universe-label">{{ 'header.myUniverse' | translate }}</span>
      </ion-button>
    </ion-buttons>

    <!-- Botón de menú desplegable para pantallas pequeñas -->
    <ion-buttons slot="end" class="contact-button-small">
      <ion-button (click)="openContactMenu($event)" [attr.aria-label]="'header.openContacts' | translate">
        <ion-icon name="person-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <!-- Botones de contacto que solo se muestran en pantallas grandes -->
    <ion-buttons slot="end" class="contact-buttons-large">
      <ion-button id="mailButton" [href]="emailHref" [attr.aria-label]="'header.sendEmail' | translate">
        <ion-icon name="mail"></ion-icon>
      </ion-button>
      <ion-button id="linkedinButton" [href]="linkedinUrl" target="_blank" [attr.aria-label]="'header.openLinkedIn' | translate">
        <ion-icon name="logo-linkedin"></ion-icon>
      </ion-button>
      <ion-button id="gitButton" [href]="githubUrl" target="_blank" [attr.aria-label]="'header.openGitHub' | translate">
        <ion-icon name="logo-github"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button
        class="language-toggle"
        (click)="toggleLanguage()"
        [attr.aria-label]="'header.language' | translate"
      >
        {{ (language$ | async)?.toUpperCase() }}
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="((themeMode$ | async) === 'dark' ? 'header.lightTheme' : 'header.darkTheme') | translate"
      >
        <ion-icon
          slot="icon-only"
          [name]="(themeMode$ | async) === 'dark' ? 'sunny-outline' : 'moon-outline'"
        ></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- Popover para menú de contacto en pantallas pequeñas -->
<ion-popover
  [event]="contactMenuEvent"
  [isOpen]="contactMenuOpen"
  (didDismiss)="closeContactMenu()"
>
  <ng-template>
    <ion-list>
      <ion-item button [href]="emailHref">
        <ion-icon slot="start" name="mail"></ion-icon>
        <ion-label>{{ 'header.email' | translate }}</ion-label>
      </ion-item>
      <ion-item button [href]="linkedinUrl" target="_blank">
        <ion-icon slot="start" name="logo-linkedin"></ion-icon>
        <ion-label>LinkedIn</ion-label>
      </ion-item>
      <ion-item button [href]="githubUrl" target="_blank">
        <ion-icon slot="start" name="logo-github"></ion-icon>
        <ion-label>GitHub</ion-label>
      </ion-item>
    </ion-list>
  </ng-template>
</ion-popover>
</ng-container>
