<h1 class="h1">{{ title }}</h1>
<swiper-container
  class="mySwiper swiper-h"
  space-between="50"
>
  <swiper-slide *ngIf="listCards.length">
    <swiper-container
      direction="vertical"
      class="swiper-v vertical-cards"
      space-between="50"
      pagination="true"
      mousewheel="true"
    >
      <swiper-slide *ngFor="let card of listCards">
        <app-card [cardData]="card" class="card-full"></app-card>
      </swiper-slide>
    </swiper-container>
  </swiper-slide>
</swiper-container>
